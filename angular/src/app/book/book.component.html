<div class="card">
  <div class="card-header">
    <div class="row">
      <div class="col col-md-6">
        <h5 class="card-title">{{ '::Menu:Books' | abpLocalization }}</h5>
      </div>
      <div class="text-end col col-md-6">
        <div class="text-lg-end pt-2">
          <!-- Add the abpPermission directive -->
          <button *abpPermission="'BookStore.Books.Create'" id="create" class="btn btn-primary" type="button" (click)="createBook()">
            <i class="fa fa-plus me-1"></i>
            <span>{{ '::NewBook' | abpLocalization }}</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="card-body">
    <ngx-datatable [rows]="book.items" [count]="book.totalCount" [list]="list" default>
      <ngx-datatable-column [name]="'::Actions' | abpLocalization" [maxWidth]="150" [sortable]="false">
        <ng-template let-row="row" ngx-datatable-cell-template>
          <div ngbDropdown container="body" class="d-inline-block">
            <button type="button" class="btn btn-primary btn-sm dropdown-toggle"
              data-toggle="dropdown" aria-haspopup="true" ngbDropdownToggle>
              <i class="fa fa-cog me-1" aria-hidden="true"></i>{{ '::Actions' | abpLocalization }}
            </button>
            <div ngbDropdownMenu>
              <button *abpPermission="'BookStore.Books.Edit'" ngbDropdownItem="" (click)="editBook(row.id)">
                {{ '::Edit' | abpLocalization }}
              </button>
              <button *abpPermission="'BookStore.Books.Delete'" ngbDropdownItem="" (click)="delete(row.id)">
                {{ '::Delete' | abpLocalization }}
              </button>
            </div>
          </div>
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column [name]="'::Name' | abpLocalization" prop="name" />
      <ngx-datatable-column [name]="'::Author' | abpLocalization" prop="authorName" [sortable]="false" />
      <ngx-datatable-column [name]="'::Type' | abpLocalization" prop="type">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ '::Enum:BookType.' + row.type | abpLocalization }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column [name]="'::PublishDate' | abpLocalization" prop="publishDate">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row.publishDate | date }}
        </ng-template>
      </ngx-datatable-column>
      <ngx-datatable-column [name]="'::Price' | abpLocalization" prop="price">
        <ng-template let-row="row" ngx-datatable-cell-template>
          {{ row.price | currency }}
        </ng-template>
      </ngx-datatable-column>
    </ngx-datatable>
  </div>
</div>

<abp-modal [(visible)]="isModalOpen">
  <ng-template #abpHeader>
    <h3>{{ (selectedBook.id ? '::Edit' : '::NewBook') | abpLocalization }}</h3>
  </ng-template>
  <ng-template #abpBody>
    <div class="form-group">
      <label for="author-id">Author</label>
      <span> * </span>
      <select class="form-control" id="author-id" formControlName="authorId">
        <option [ngValue=""]="null">Select author</option>
        @for (author of authors$ | async; track author) {
        <option [ngValue=""]="author.id">
          {{ author.name }}
        </option>
        }
      </select>
    </div>
    <form [formGroup]="form" (ngSubmit)="save()">
      <div class="mt-2">
        <label for="book-name">Name</label><span> * </span>
        <input id="book-name" type="text" class="form-control" formControlName="name" autofocus />
      </div>
      <div class="mt-2">
        <label for="book-price">Price</label><span> * </span>
        <input id="book-price" type="number" class="form-control" formControlName="price" />
      </div>
      <div class="mt-2">
        <label for="book-type">Type</label><span> * </span>
        <select id="book-type" class="form-control" formControlName="type">
          <option [ngValue]="null">Select a book type</option>
          @for (type of bookTypes; track type) {
            <option [ngValue]="type.value">{{ '::Enum:BookType.' + type.value | abpLocalization }}</option>
          }
        </select>
      </div>
      <div class="mt-2">
        <label for="book-publish-date">Publish date</label><span> * </span>
        <input id="book-publish-date" class="form-control" formControlName="publishDate"
          name="datepicker" #datepicker="ngbDatepicker" ngbDatepicker (click)="datepicker.toggle()" />
      </div>
    </form>
  </ng-template>
  <ng-template #abpFooter>
    <button type="button" class="btn btn-secondary" abpClose>{{ '::Close' | abpLocalization }}</button>
    <button class="btn btn-primary" (click)="save()" [disabled]="form.invalid">
      <i class="fa fa-check mr-1" aria-hidden="true"></i>{{ '::Save' | abpLocalization }}
    </button>
  </ng-template>
</abp-modal>
