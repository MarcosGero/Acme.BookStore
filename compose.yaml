services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: BookStore
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123qwe
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
    name: bookstore-postgres-data
